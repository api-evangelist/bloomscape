aid: bloomscape
name: Bloomscape
description: 'Bloomscape is a direct-to-consumer houseplant company that grows plants in its own greenhouses
  and ships them fully grown directly to customers'' doors, bypassing traditional retail and nursery
  supply chains. Alongside houseplants, it sells planters, plant-care accessories, and gifting options,
  and backs every order with its Grow-How team of horticultural experts plus a plant guarantee. The
  company was surfaced as a portfolio company of General Catalyst and added to the API Evangelist network.
  Bloomscape operates a consumer e-commerce storefront and publishes no public developer API, SDK, or
  documented developer surface at this time; this profile captures its public web, support, and legal
  properties along with a domain-security probe.'
